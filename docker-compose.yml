# Local stack — backend build context is ./src
#   docker compose up api
#   docker compose --profile ui up
#   docker compose --profile qdrant up

services:
  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OCR_ENGINE=digital
      - MODELS_DIR=/deps/ArabicOCRRAGAgent/models
      - VECTORSTORE_PERSIST_DIR=/deps/ArabicOCRRAGAgent/data/chroma
      - VECTORSTORE_BACKEND=${VECTORSTORE_BACKEND:-chroma}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - VALIDATE_SETTINGS_ON_STARTUP=${VALIDATE_SETTINGS_ON_STARTUP:-false}
      - LOG_FORMAT=${LOG_FORMAT:-text}
    volumes:
      - ./src/models:/deps/ArabicOCRRAGAgent/models
      - ./src/data:/deps/ArabicOCRRAGAgent/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ok', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  frontend:
    profiles: ["ui"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_LANGGRAPH_API_URL=http://localhost:8000
      - VITE_LANGGRAPH_ASSISTANT_ID=agent
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api

  qdrant:
    profiles: ["qdrant"]
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  frontend_node_modules:
  qdrant_data:
