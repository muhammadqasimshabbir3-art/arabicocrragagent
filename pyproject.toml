[project]
name = "arabic-ocr-rag-agent"
version = "0.2.0"
description = "Arabic Document Intelligence Agent: OCR, embeddings, and grounded RAG with citations."
authors = [
    { name = "Muhammad Qasim Shabbir", email = "muhammadqasimshabbir3@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.1.0",
    "langchain-groq>=0.1.0",
    "langchain-community>=0.1.0",
    "requests>=2.31.0",
    "streamlit>=1.28.0",
    "langgraph-api==0.10.0",
    "pypdf>=4.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "accelerate>=0.33.0",
    "qwen-vl-utils>=0.0.8",
    "Pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "numpy>=1.26.0",
    "faiss-cpu>=1.8.0",
    "qdrant-client>=1.9.0",
    "python-docx>=1.2.0",
    "duckduckgo-search>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "ruff>=0.6.1",
    "langgraph-cli[inmem]>=0.4.14",
]
ui = ["streamlit>=1.28.0"]
openai = ["langchain-openai>=0.1.0"]
gemini = ["langchain-google-genai>=2.0.0"]
faiss = ["faiss-cpu>=1.8.0"]
qdrant = ["qdrant-client>=1.9.0"]


[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "agent*",
    "config*",
    "state*",
    "routing*",
    "loaders*",
    "ocr*",
    "preprocess*",
    "chunking*",
    "embeddings*",
    "vectorstore*",
    "retriever*",
    "reranker*",
    "llm*",
    "prompts*",
    "utils*",
    "tools*",
]

[tool.setuptools.package-dir]
"" = "src"
"langgraph.templates.agent" = "src/agent"

[tool.setuptools.package-data]
"agent" = ["py.typed"]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",
    "F",
    "I",
    "D",
    "D401",
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: tests that call live services (Groq/OCR/etc.)",
    "langsmith: optional LangSmith-traced integration tests",
]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]
