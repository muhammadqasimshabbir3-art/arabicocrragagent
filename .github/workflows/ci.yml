name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check agent core subagents tools ../tests

      - name: Unit tests
        run: uv run pytest ../tests/unit_tests -q

      - name: Mypy (non-blocking)
        continue-on-error: true
        run: uv run mypy core/utils core/config core/prompts --ignore-missing-imports
